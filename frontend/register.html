<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOI Register</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow-x:hidden;

    background:
    linear-gradient(
    rgba(38,140,83,0.92),
    rgba(38,140,83,0.92)),

    url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?q=80&w=1400");

    background-size:cover;
    background-position:center;

    padding:20px;

    animation:
    pageEnter 0.4s ease;

}



/* PAGE ENTER */

@keyframes pageEnter{

    from{

        opacity:0;

        transform:
        translateX(40px);

    }

    to{

        opacity:1;

        transform:
        translateX(0);

    }

}



/* CARD */

.auth-card{

    width:100%;
    max-width:520px;

    background:white;

    border-radius:30px;

    padding:40px;

    position:relative;

    overflow:hidden;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.15);

}



/* INPUT */

.input-box{

    width:100%;

    padding:14px 16px 14px 45px;

    border:1px solid #dbe2ea;

    border-radius:14px;

    outline:none;

    background:#f8fafc;

    font-size:14px;

    transition:0.3s;

}


.input-box:focus{

    border-color:#2E8B57;

    background:white;

    box-shadow:
    0 0 0 4px rgba(46,139,87,0.12);

}



/* BUTTON */

.main-btn{

    width:100%;

    background:#2E8B57;

    color:white;

    border:none;

    padding:14px;

    border-radius:14px;

    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:0.3s;

}


.main-btn:hover{

    background:#256f46;

    transform:translateY(-2px);

}

/*contine button*/
#continueBtn{

    width: 100%;

    background-color: #15803d;

    color: white;

    padding: 14px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.3s;
}


#continueBtn:hover{

    background-color: #166534;

}


#continueBtn:disabled{

    background-color: #86efac;

    cursor: not-allowed;
}


/* STEP 2 */

#form-step-2{

    display:none;

}








.small-select{

    width:100%;

    height:44px;

    border:1px solid #dbe2ea;

    border-radius:12px;

    padding-left:38px;

    padding-right:12px;

    background:#f8fafc;

    font-size:13px;

    font-weight:500;

    color:#1e293b;

    outline:none;

    transition:0.3s ease;

    appearance:none;

    cursor:pointer;
}


.small-input{

    width:100%;

    height:44px;

    border:1px solid #dbe2ea;

    border-radius:12px;

    padding:0 14px;

    background:#f8fafc;

    font-size:13px;

    font-weight:500;

    color:#1e293b;

    outline:none;

    transition:0.3s ease;
}


.small-input:focus{

    border-color:#2E8B57;

    background:white;

    box-shadow:
    0 0 0 3px
    rgba(46,139,87,0.12);

}

.small-select:focus{

    border-color:#2E8B57;

    background:white;

    box-shadow:
    0 0 0 3px
    rgba(46,139,87,0.12);

}

</style>

</head>
<body>



<div class="auth-card">


<!-- STEP TOP -->

<div class="flex items-center justify-between mb-10">

    <div class="flex items-center gap-3">

        <div id="badge1"
        class="w-9 h-9 rounded-full bg-[#2E8B57] text-white flex items-center justify-center text-sm font-semibold">

            1

        </div>

        <div class="w-12 h-[2px] bg-slate-200"></div>

        <div id="badge2"
        class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center text-sm font-semibold">

            2

        </div>

    </div>

    <span id="stepText"
    class="text-xs uppercase tracking-wide text-slate-400 font-semibold">

        Step 1 of 2

    </span>

</div>





<!-- STEP 1 -->

<div id="form-step-1">


<div class="mb-8">

    <h1 class="text-3xl font-bold text-slate-900">
        Create Account
    </h1>

    <p class="text-slate-500 mt-2 text-sm">
        Enter your personal details
    </p>

</div>



<div class="space-y-4">


<!-- FULL NAME -->

<div class="relative">

    <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

    <input
    type="text"
    class="input-box"
    placeholder="Full Name"
    required>

</div>



<!-- EMAIL -->

<div class="relative">

    <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

    <input
    type="email"
    class="input-box"
    placeholder="Email Address"
    required>

</div>



<!-- PHONE -->

<div class="relative">

    <i class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

    <input
    type="tel"
    class="input-box"
    placeholder="Phone Number"
    required
    pattern="[0-9]{10}">

</div>



<!-- PASSWORD -->

<div class="relative">

    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

<input
id="password"
type="password"
class="input-box"
placeholder="Password"
required>

</div>



<!-- CONFIRM PASSWORD -->

<div class="relative">

    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

<input
id="confirmPassword"
type="password"
class="input-box"
placeholder="Confirm Password"
required>

</div>



<!-- BUTTON -->

<button
id="continueBtn"
onclick="goToStep2()">
    Continue
</button>



<div class="text-center pt-3">

    <p class="text-sm text-slate-500">

        Already have an account?

        <a href="index.html"
        class="text-[#2E8B57] font-semibold hover:underline">

            Sign In

        </a>

    </p>

</div>


</div>

</div>






<!-- STEP 2 -->

<div id="form-step-2">


<div class="mb-8">

    <h1 class="text-3xl font-bold text-slate-900">
        Company Details
    </h1>

    <p class="text-slate-500 mt-2 text-sm">
        Setup your organization
    </p>

</div>



<div class="space-y-4">


<!-- COMPANY -->

<div class="relative">

    <i class="fa-regular fa-building absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

    <input
    type="text"
    class="input-box"
    placeholder="Company Name"
    required>

</div>



<!-- INDUSTRY -->

<div class="relative">

    <i class="fa-solid fa-industry absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

    <select class="input-box appearance-none" required>

        <option value="" disabled selected>
            Select Industry
        </option>

        <option>Manufacturing</option>

        <option>Textile</option>

        <option>Dyeing</option>

    </select>

</div>



<!-- LOCATION -->

<div class="grid grid-cols-3 gap-3">


<!-- STATE -->

<select
id="state"
required
class="border border-slate-200 rounded-xl px-3 py-3 outline-none focus:border-[#2E8B57] bg-white text-sm">

    <option value="">
        State
    </option>
     <option>Kerala</option>
     <option>Tamil Nadu</option>
     <option>Karnataka</option>

</select>



<!-- DISTRICT -->

<select
id="district"
required
class="border border-slate-200 rounded-xl px-3 py-3 outline-none focus:border-[#2E8B57] bg-white text-sm">

    <option value="">
        District
    </option>
     <option>chennai</option>
     <option>Coimbatore</option>
     <option>Trichy</option>

</select>



<!-- CITY -->

<select
id="city"
required
class="border border-slate-200 rounded-xl px-3 py-3 outline-none focus:border-[#2E8B57] bg-white text-sm">

    <option value="">
        City
    </option>
     <option>RS Puram</option>
     <option>Peelambedu</option>
     <option>Gandhipuram</option>

</select>


</div>






<!-- BASIC SETUP -->








<!-- ROW 2 -->



  
     



  <!-- CTO SECTION -->

<div class="relative">

    <i class="fa-solid fa-file-circle-check absolute left-3 top-1/2 -translate-y-1/2 text-[#2E8B57] text-sm"></i>

    <select
    id="ctoAvailable"
    class="small-select"
    onchange="toggleCTOFields()"
    required>

        <option value="" disabled selected>
            CTO Available
        </option>

        <option value="Yes">
            Yes
        </option>

        <option value="No">
            No
        </option>

    </select>

</div>



<!-- CTO EXTRA FIELDS -->

<div
id="ctoFields"
class="hidden space-y-3 mt-3">


    <!-- CTO NUMBER -->

    <div class="relative">

        <i class="fa-solid fa-file-signature absolute left-3 top-1/2 -translate-y-1/2 text-[#2E8B57] text-sm"></i>

        <input
        id="ctoNumber"
        type="text"
        class="small-input"
        placeholder="   CTO Number">

    </div>



    <!-- CTO DATES -->

    <div class="grid grid-cols-2 gap-3">


        <!-- ISSUE DATE -->

        <div class="relative">

              <label class="text-xs text-slate-500 font-medium mb-1 block">

            CTO Issue Date

        </label>

            <input
            id="ctoIssueDate"
            type="date"
            class="small-input">

        </div>



        <!-- EXPIRY DATE -->

        <div class="relative">

              <label class="text-xs text-slate-500 font-medium mb-1 block">

            CTO Expiry Date

        </label>

            <input
            id="ctoExpiryDate"
            type="date"
            class="small-input">

        </div>

    </div>

</div>

<!-- BUTTONS -->

<div class="flex gap-3 pt-3">


<button
type="button"
onclick="goToStep1()"
class="w-1/3 border border-slate-200 hover:bg-slate-50 text-slate-600 py-3 rounded-xl font-semibold transition-all">

    Back

</button>


<button
type="button"
onclick="createAccount()"
class="w-2/3 main-btn">

    Create Account

</button>


</div>

</div>

</div>


</div>



<script>

// ======================================
// STEP ELEMENTS
// ======================================

const step1 =
document.getElementById("form-step-1");

const step2 =
document.getElementById("form-step-2");

const badge1 =
document.getElementById("badge1");

const badge2 =
document.getElementById("badge2");

const stepText =
document.getElementById("stepText");



// ======================================
// PASSWORDS
// ======================================

const password =
document.getElementById(
"password"
);

const confirmPassword =
document.getElementById(
"confirmPassword"
);



// ======================================
// LOCATION SELECTS
// ======================================

const stateSelect =
document.getElementById("state");

const districtSelect =
document.getElementById("district");

const citySelect =
document.getElementById("city");



// ======================================
// SEND OTP
// ======================================

async function goToStep2(){

    const continueBtn =
    document.getElementById(
    "continueBtn"
    );

    continueBtn.disabled = true;

    try{

        const inputs =
        step1.querySelectorAll("input");

        for(let input of inputs){

            if(!input.checkValidity()){

                input.reportValidity();

                continueBtn.disabled = false;

                return;
            }

        }

        if(password.value !== confirmPassword.value){

            alert("Passwords do not match");

            continueBtn.disabled = false;

            return;
        }

        const email =
        document.querySelector(
        'input[type="email"]'
        ).value;

        const response = await fetch(
        "http://localhost:8000/api/auth/send-otp",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email:email
            })
        });

        const result =
        await response.json();

        console.log(result);

        if(response.ok){

            document
            .getElementById("otpModal")
            .classList
            .remove("hidden");

            document
            .getElementById("otpModal")
            .classList
            .add("flex");

            alert("OTP sent successfully");

        }else{

            alert(result.detail);

        }

    }catch(error){

        console.log(error);

        alert(error.message);

    }finally{

        continueBtn.disabled = false;

    }

}



// ======================================
// VERIFY OTP
// ======================================

async function verifyOTP(){

    const enteredOTP =
    document.getElementById(
    "otpInput"
    ).value;

    const email =
    document.querySelector(
    'input[type="email"]'
    ).value;

    try{

        const response = await fetch(
        "http://localhost:8000/api/auth/verify-otp",
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
                email:email,
                otp:enteredOTP
            })
        });

        const result =
        await response.json();

        console.log(result);

        if(response.ok){

            document
            .getElementById("otpModal")
            .classList
            .add("hidden");

            step1.style.display =
            "none";

            step2.style.display =
            "block";

            badge1.classList.remove(
                "bg-[#2E8B57]",
                "text-white"
            );

            badge1.classList.add(
                "bg-green-100",
                "text-[#2E8B57]"
            );

            badge2.classList.remove(
                "bg-slate-100",
                "text-slate-400"
            );

            badge2.classList.add(
                "bg-[#2E8B57]",
                "text-white"
            );

            stepText.innerText =
            "STEP 2 OF 2";

            alert(
                "OTP verified successfully"
            );

        }else{

            alert(result.detail);

        }

    }catch(error){

        console.log(error);

        alert(error.message);

    }

}




function toggleCTOFields(){

    const ctoValue =
    document.getElementById(
    "ctoAvailable"
    ).value;

    const ctoFields =
    document.getElementById(
    "ctoFields"
    );

    const ctoNumber =
    document.getElementById(
    "ctoNumber"
    );

    const issueDate =
    document.getElementById(
    "ctoIssueDate"
    );

    const expiryDate =
    document.getElementById(
    "ctoExpiryDate"
    );



    if(ctoValue === "Yes"){

        ctoFields.classList.remove(
        "hidden"
        );

        ctoNumber.required = true;

        issueDate.required = true;

        expiryDate.required = true;

    }else{

        ctoFields.classList.add(
        "hidden"
        );

        ctoNumber.required = false;

        issueDate.required = false;

        expiryDate.required = false;

    }

}



// ======================================
// CREATE ACCOUNT
// ======================================

async function createAccount(){

    try{

        const data = {

    full_name:
    document.querySelector(
    'input[placeholder="Full Name"]'
    ).value,

    email:
    document.querySelector(
    'input[type="email"]'
    ).value,

    phone_number:
    document.querySelector(
    'input[type="tel"]'
    ).value,

    password:
    password.value,

    confirm_password:
    confirmPassword.value,

    company_name:
    document.querySelector(
    'input[placeholder="Company Name"]'
    ).value,

    industry_type:
    document.querySelectorAll(
    "select"
    )[0].value,

    state:
    stateSelect.value,

    district:
    districtSelect.value,

    city:
    citySelect.value,

    address:
    "Address",

    cto_available:
    document.getElementById(
    "ctoAvailable"
    ).value,

    cto_number:
    document.getElementById(
    "ctoNumber"
    )?.value || null,

    cto_issue_date:
    document.getElementById(
    "ctoIssueDate"
    )?.value || null,

    cto_expiry_date:
    document.getElementById(
    "ctoExpiryDate"
    )?.value || null
};

        console.log(data);

        const response = await fetch(
            "http://127.0.0.1:8000/api/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify(data)
            }
        );

        const result =
        await response.json();

        console.log(result);

        if(response.ok){

            alert(
            "Account Created Successfully"
            );

            window.location.href =
            "index.html";

      }else{

    console.log(result);

    alert(
    JSON.stringify(result)
    );

}

    }catch(error){

        console.log(error);

        alert(error.message);

    }

}
// ======================================
// BACK BUTTON
// ======================================

function goToStep1(){

    step2.style.display = "none";

    step1.style.display = "block";

    badge1.classList.remove(
    "bg-green-100",
    "text-[#2E8B57]"
    );

    badge1.classList.add(
    "bg-[#2E8B57]",
    "text-white"
    );

    badge2.classList.remove(
    "bg-[#2E8B57]",
    "text-white"
    );

    badge2.classList.add(
    "bg-slate-100",
    "text-slate-400"
    );

    stepText.innerText =
    "STEP 1 OF 2";

}

</script>
<!-- OTP MODAL -->

<div id="otpModal"
class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">

    <div class="bg-white w-full max-w-sm rounded-3xl p-8">

        <div class="text-center mb-6">

            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">

                <i class="fa-solid fa-envelope text-[#2E8B57] text-2xl"></i>

            </div>

            <h2 class="text-2xl font-bold text-slate-900">
                Verify OTP
            </h2>

            <p class="text-slate-500 text-sm mt-2">
                Enter OTP sent to your email
            </p>

        </div>



        <input
        type="text"
        id="otpInput"
        maxlength="6"
        placeholder="Enter 6 Digit OTP"
        class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-[#2E8B57] text-center text-lg tracking-[8px]">



        <button
        onclick="verifyOTP()"
        class="main-btn mt-5">

            Verify OTP

        </button>

    </div>

</div>
</body>
</html>
